<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span id="theme-label">OSCURO</span><span class="switch" aria-hidden="true"></span>
  </button>

  <h1 class="title" aria-label="Tetris">
    <span aria-hidden="true">T</span><span aria-hidden="true">E</span><span aria-hidden="true">T</span><span aria-hidden="true">R</span><span aria-hidden="true">I</span><span aria-hidden="true">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>Shift</kbd> guardar</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="hidden">
          <label for="name-input">¡Entras en el Top 5! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" autocomplete="off" />
            <button id="name-save" type="button">Guardar</button>
          </div>
        </div>
        <div id="over-records" class="records-block hidden">
          <span class="label">RÉCORDS</span>
          <ol class="records-list"></ol>
          <p class="records-stats">Mejor combo: <b class="records-best-combo">0</b> · Máx. líneas: <b class="records-max-lines">0</b></p>
          <button type="button" class="records-reset">Resetear récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">RÉCORDS</p>
        <div class="records-block">
          <ol class="records-list"></ol>
          <p class="records-stats">Mejor combo: <b class="records-best-combo">0</b> · Máx. líneas: <b class="records-max-lines">0</b></p>
          <button type="button" class="records-reset">Resetear récords</button>
        </div>
        <button id="start-btn" type="button">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
